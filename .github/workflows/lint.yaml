name: lint

on:
  push:
    branches: [main, "refactor/*"]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps (CPU-only)
        run: |
          python -m pip install --upgrade pip
          # Install torch CPU wheel directly to keep CI fast.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.46.3 numpy pytest

      - name: Run acceptance-rule unit tests
        # These tests cover the paper's mathematical content and require no GPU.
        run: pytest tests/test_acceptance_rules.py -v
